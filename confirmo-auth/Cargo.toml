[package]
name = "confirmo-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
confirmo-shared = { path = "../confirmo-shared", features = ["grpc"] }
confirmo-utils = { path = "../confirmo-utils" }
tokio = { version = "1.49.0", features = ["rt-multi-thread"]}
tonic = { version = "*" }
prost = { version = "*"}
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls", "uuid", "chrono"]}
async-trait = "0.1.89"
mockall = "0.14.0"
regex = "1.12.2"
argon2 = "0.5.3"
clap = { version = "4.5.54", features = ["derive", "env"]}
dotenvy = { version = "0.15.7" }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
rand = "0.9.2"
sha2 = "0.10.9"
hmac = "0.12.1"
hex = "0.4.3"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
serde = { version = "1.0.228"}
serde_json = { version = "1.0.149" }
uuid = { version = "1.20.0", features = ["v4"]}
tower = "0.5.3"
futures = "0.3.31"
http = "1.4.0"