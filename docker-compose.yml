services:
  confirmo-auth-db:
    image: postgres:16
    container_name: confirmo-auth-db
    environment:
      POSTGRES_USER: "${CONFIRMO_AUTH_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${CONFIRMO_AUTH_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${CONFIRMO_AUTH_POSTGRES_DB}"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONFIRMO_AUTH_POSTGRES_USER} -d ${CONFIRMO_AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  confirmo-graphql-db:
    image: postgres:16
    container_name: confirmo-graphql-db
    environment:
      POSTGRES_USER: "${CONFIRMO_GRAPHQL_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${CONFIRMO_GRAPHQL_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${CONFIRMO_GRAPHQL_POSTGRES_DB}"
    volumes:
      - graphql_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONFIRMO_GRAPHQL_POSTGRES_USER} -d ${CONFIRMO_GRAPHQL_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  broker:
    image: apache/kafka:3.7.0
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./create_topics.sh:/create_topics.sh:ro
    entrypoint: ["bash", "/create_topics.sh"]

  confirmo-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: confirmo-auth
        BIN: confirmo-auth
    image: confirmo-auth:latest
    container_name: confirmo-auth
    restart: unless-stopped
    environment:
      SERVER_PORT: "${CONFIRMO_AUTH_SERVER_PORT}"
      DATABASE_URL: "${CONFIRMO_AUTH_DATABASE_URL}"
      HASH_SECRET: "${CONFIRMO_AUTH_HASH_SECRET}"
      KAFKA_BROKERS: "${CONFIRMO_AUTH_KAFKA_BROKERS}"
      KAFKA_TOPIC_AUTH_EMAIL_VERIFICATION: "${CONFIRMO_AUTH_KAFKA_TOPIC_AUTH_EMAIL_VERIFICATION}"
      KAFKA_TOPIC_AUTH_EMAIL_VERIFIED: "${CONFIRMO_AUTH_KAFKA_TOPIC_AUTH_EMAIL_VERIFIED}"
    ports:
      - "5051:5051"
    depends_on:
      confirmo-auth-db:
        condition: service_healthy
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  confirmo-graphql:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: confirmo
        BIN: confirmo
    image: confirmo-graphql:latest
    container_name: confirmo-graphql
    restart: unless-stopped
    environment:
      SERVER_PORT: "${CONFIRMO_GRAPHQL_SERVER_PORT}"
      AUTH_CONNNECTION_URL: "${CONFIRMO_GRAPHQL_AUTH_CONNNECTION_URL}"
      DATABASE_URL: "${CONFIRMO_GRAPHQL_DATABASE_URL}"
      KAFKA_BROKERS: "${CONFIRMO_GRAPHQL_KAFKA_BROKERS}"
      KAFKA_CONSUMER_GROUP_ID: "${CONFIRMO_GRAPHQL_KAFKA_CONSUMER_GROUP_ID}"
      KAFKA_CONSUMER_TOPICS: "${CONFIRMO_GRAPHQL_KAFKA_CONSUMER_TOPICS}"
    ports:
      - "3001:3001"
    depends_on:
      confirmo-graphql-db:
        condition: service_healthy
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      confirmo-auth:
        condition: service_started

  confirmo-notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: confirmo-notification-service
        BIN: confirmo-notification-service
    image: confirmo-notification-service:latest
    container_name: confirmo-notification-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: "${CONFIRMO_NOTIFICATION_KAFKA_BROKERS}"
      KAFKA_CONSUMER_TOPICS: "${CONFIRMO_NOTIFICATION_KAFKA_CONSUMER_TOPICS}"
      KAFKA_CONSUMER_GROUP_ID: "${CONFIRMO_NOTIFICATION_KAFKA_CONSUMER_GROUP_ID}"
      SMTP_USERNAME: "${CONFIRMO_NOTIFICATION_SMTP_USERNAME}"
      SMTP_PASSWORD: "${CONFIRMO_NOTIFICATION_SMTP_PASSWORD}"
      SMTP_FROM: "${CONFIRMO_NOTIFICATION_SMTP_FROM}"
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  kafka_data:
  auth_db_data:
  graphql_db_data:
