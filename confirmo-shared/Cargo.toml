[package]
name = "confirmo-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"]}
serde_json = { version = "1.0.149" }
tracing = { version = "0.1.44", optional = true }
uuid = { version = "1.20.0", features = ["v4"], optional = true }

tonic = { version = "0.14.3", optional = true }
prost = { version = "0.14.3", optional = true }
tonic-prost = { version = "0.14.3", optional = true }
rdkafka = { version = "0.39.0", features = ["cmake-build"], optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14.3", optional = true }

[features]
default = []
grpc = ["dep:tonic", "dep:prost", "dep:tonic-prost", "dep:tonic-prost-build"]
kafka = ["dep:rdkafka", "dep:tracing", "dep:uuid"]
full = ["grpc", "kafka"]